# `url` is load-bearing: without it `absolute_url` and `{{ site.url }}` render
# empty, and Google silently ignores every relative canonical and hreflang.
url: "https://julien-millau.fr"
baseurl: ""
lang: en

title: Julien MILLAU
description: "Android and iOS apps by Julien Millau — Currency Converter & Exchange, Credit Card Reader NFC and NFC Tag Reader."

markdown: kramdown
highlighter: rouge
excerpt_separator: ""
keep_files: [app-ads.txt]
permalink: none
safe: true
lsi: false

# No plugins. sitemap.xml is a Liquid template at the repository root, so Jekyll
# rebuilds it on every build and a new post cannot fall out of it. It replaces
# jekyll-sitemap, which emits no <lastmod> for pages and no <xhtml:link>
# hreflang alternates — both of which this site needs.

# The generator and its state are build inputs, not site content.
# `exclude` replaces Jekyll's default list rather than extending it, so the
# defaults are repeated here — dropping them would publish a Gemfile or a
# vendor directory the day one is added.
exclude:
  - tools/
  - README.md
  - .sass-cache/
  - .jekyll-cache/
  - gemfiles/
  - Gemfile
  - Gemfile.lock
  - node_modules/
  - vendor/
