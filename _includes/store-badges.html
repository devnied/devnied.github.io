{%- assign dir = include.dir | default: '/images/badges/en' -%}
<ul class="store-badges{% if include.center %} store-badges-center{% endif %}">
{%- if include.play %}
    <li class="store-badge-google"><a href="{{ include.play | escape }}" target="_blank" rel="noopener"><img src="{{ dir }}/google-play.png" width="176" height="68" alt="{{ include.play_alt | escape }}" loading="lazy" decoding="async"></a></li>
{%- endif %}
{%- if include.apple %}
    <li class="store-badge-apple"><a href="{{ include.apple | escape }}" target="_blank" rel="noopener"><img src="{{ dir }}/app-store.svg" width="138" height="46" alt="{{ include.apple_alt | escape }}" loading="lazy" decoding="async"></a></li>
{%- endif %}
{%- if include.samsung %}
    <li class="store-badge-samsung"><a href="{{ include.samsung | escape }}" target="_blank" rel="noopener"><img src="/images/badges/en/galaxy-store.png" width="169" height="46" alt="{{ include.samsung_alt | escape }}" loading="lazy" decoding="async"></a></li>
{%- endif %}
{%- if include.huawei %}
